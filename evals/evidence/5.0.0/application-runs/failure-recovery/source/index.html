<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Issue Queue</title>
<style>body{max-width:48rem;margin:3rem auto;padding:0 1rem;font:16px system-ui;color:#18302a;background:#f6f8f7}input,select,button{font:inherit;padding:.6rem;border:1px solid #708079;border-radius:.3rem}button{background:#183f32;color:white;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b68421;outline-offset:2px}form{display:flex;gap:.6rem;flex-wrap:wrap}article{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid #ccd5d0}#feedback{min-height:1.5rem}h1{font-size:2rem}</style>
<h1>Issue queue</h1><p>Local synthetic test data. Track a request and close it when resolved.</p><form id="ticket-form"><label>Request <input name="title" required maxlength="120"></label><button type="submit">Save request</button></form><p id="feedback" role="status" aria-live="polite"></p><label>Show <select id="status-filter"><option value="all">All requests</option><option value="open">Open</option><option value="closed">Closed</option></select></label><section id="tickets" aria-live="polite"></section>
<script>
const list=document.querySelector('#tickets'),feedback=document.querySelector('#feedback'),filter=document.querySelector('#status-filter');
async function load(){try{const r=await fetch('/api/tickets?status='+filter.value);if(!r.ok)throw Error('Unable to load requests.');const data=await r.json();list.replaceChildren();if(!data.length){list.textContent='No requests yet.';return;}for(const ticket of data){const row=document.createElement('article');row.dataset.ticketId=ticket.id;const text=document.createElement('span');text.textContent=ticket.title+' · '+ticket.status;row.append(text);if(ticket.status==='open'){const close=document.createElement('button');close.textContent='Close request';close.dataset.action='close';close.onclick=async()=>{await fetch('/api/tickets/'+ticket.id+'/close',{method:'POST'});await load();};row.append(close);}list.append(row);}}catch(e){feedback.textContent=e.message;}}
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const input=e.target.elements.title;const r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});if(!r.ok){feedback.textContent='Could not save. Check the request and retry.';return;}input.value='';feedback.textContent='Request saved.';await load();};
filter.onchange=load;
load();
</script></html>
